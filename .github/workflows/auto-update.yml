name: Update and publish to AUR

# 版本来源 = 上游 release 列表（含 prerelease）：上游发什么，AUR 就是什么。
# 判定逻辑在 .github/scripts/ 下，可脱离 Actions 本地运行验证。

on:
  schedule:
    - cron: '0 3 * * *'
  # 手动改 PKGBUILD 后推到 master 立刻走一遍发布检查
  push:
    branches: [master]
    paths:
      - PKGBUILD
      - .SRCINFO
  workflow_dispatch:
    inputs:
      force_publish:
        description: "忽略与 AUR 的内容比对，强制推送一次"
        type: boolean
        default: false

permissions:
  contents: write

# 手动 dispatch 与 cron 撞车时不并发跑两个 update
concurrency:
  group: aghub-bin-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git jq curl pacman-contrib

      # fetch-depth: 0 是给后面 git pull --rebase 用的
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert tag -> pkgver mapping invariants
        run: bash .github/scripts/test-mapping.sh

      - name: Select upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: AkaraChen/aghub
        run: |
          set -euo pipefail
          CURRENT_PKGVER="$(sed -n 's/^pkgver=//p' PKGBUILD)" \
            bash .github/scripts/select-upstream-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Rewrite PKGBUILD, verify checksums, regenerate .SRCINFO
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          NEW_PKGVER: ${{ steps.upstream.outputs.pkgver }}
        run: |
          set -euo pipefail
          # makepkg 不允许以 root 运行
          useradd -m builduser
          chown -R builduser:builduser .
          git config --global --add safe.directory '*'
          su builduser -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && env UPSTREAM_TAG='$UPSTREAM_TAG' NEW_PKGVER='$NEW_PKGVER' bash .github/scripts/update-pkgbuild.sh"

      - name: Commit and push if upstream changed something
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILD/.SRCINFO 与上游一致，无需提交"
            exit 0
          fi
          PKGVER="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          PKGREL="$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          echo "::notice::提交 ${PKGVER}-${PKGREL}（上游 ${{ steps.upstream.outputs.tag }}，原因 ${{ steps.upstream.outputs.new_version == 'true' && 'version' || 'checksums' }}）"
          git commit -m "Update to ${PKGVER}-${PKGREL} (upstream ${{ steps.upstream.outputs.tag }})"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  publish:
    needs: update
    # update 失败时也要能发布仓库里已提交的内容（例如手动改 PKGBUILD 的场景）
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Compare local PKGBUILD with AUR
        id: aur
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.force_publish }}" = "true" ]; then
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "force_publish=true，跳过比对"
            exit 0
          fi
          if ! git clone --depth=1 -q https://aur.archlinux.org/aghub-bin.git /tmp/aur; then
            echo "AUR 上没有 aghub-bin 或无法克隆，按首次发布处理"
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python3 .github/scripts/aur-drift.py /tmp/aur/PKGBUILD PKGBUILD; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "AUR 与本地一致，跳过发布"
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "AUR 与本地不一致，需要发布"
          fi

      - name: Publish to AUR
        if: steps.aur.outputs.needs_publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: aghub-bin
          pkgbuild: ./PKGBUILD
          assets: aghub.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
